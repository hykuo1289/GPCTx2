<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>抗生素防線 - 醫師守衛戰</title>
    <style>
        body {
            background-color: #2c3e50;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }
        canvas {
            background-color: #34495e;
            border: 4px solid #bdc3c7;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .instructions {
            background-color: #1a252f;
            padding: 20px;
            border-radius: 10px;
            max-width: 800px;
        }
        .key {
            background-color: #e74c3c;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>抗生素防線</h1>
    <canvas id="gameCanvas" width="1000" height="300"></canvas>
    <h2 id="scoreBoard">分數: 0</h2>

    <div class="instructions">
        <h3>操作說明：</h3>
        <p><span class="key">W</span> / <span class="key">S</span> : 向上/向下移動一格</p>
        <p><span class="key">A</span> : 切換武器</p>
        <p><span class="key">空白鍵</span> : 發射武器 (發射後會有1秒鐘的後座力無法動作)</p>
        <p><span class="key">R</span> : 遊戲結束時，按下可**重新開始**</p>
        <hr>
        <p><strong>武器與細菌剋星：</strong></p>
        <ul>
            <li><strong>Penicillin (衝鋒槍)</strong>：秒殺鏈球菌 (對葡萄球菌/MRSA無效)</li>
            <li><strong>Oxacillin (火箭筒)</strong>：秒殺葡萄球菌，對鏈球菌造成1/2傷害 (對MRSA無效)</li>
            <li><strong>Vancomycin (大砲)</strong>：秒殺MRSA，對葡萄球菌造成1/2傷害，對鏈球菌造成1/3傷害</li>
        </ul>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreBoard = document.getElementById('scoreBoard');

// 遊戲常數與設定
const ROWS = 3;
const COLS = 10;
const CELL_SIZE = 100;
let score = 0;
let gameOver = false;
let gameStarted = false;

// 難度控制變數（已將速度調慢為原來的 2/3）
let baseEnemySpeed = 1 * (2 / 3); // 原每秒1格 -> 調整後約 0.67 格
let maxEnemySpeed = 2 * (2 / 3);  // 原每秒2格 -> 調整後約 1.33 格
let baseSpawnTime = 2000; // 2秒一隻
let minSpawnTime = 1000;  // 1秒一隻
let lastSpawnTime = 0;
let gameStartTime = 0;

// 音效系統 (Web Audio API)
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
    if (!audioCtx) return;

    if (type === 'smg') {
        // 衝鋒槍 答答聲
        for(let i=0; i<3; i++) {
            setTimeout(() => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'square';
                o.frequency.setValueAtTime(150, audioCtx.currentTime);
                o.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.05);
                g.gain.setValueAtTime(0.3, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + 0.05);
            }, i * 100);
        }
    } else if (type === 'rocket') {
        // 火箭筒 咻~聲
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'cannon') {
        // 大砲 碰！聲
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    }
}

// 玩家物件
const player = {
    row: 1, 
    weapon: 0, 
    locked: false 
};

const weapons = [
    { name: "Penicillin", color: "#3498db" },
    { name: "Oxacillin", color: "#e67e22" },
    { name: "Vancomycin", color: "#9b59b6" }
];

let projectiles = [];
let enemies = [];

const enemyConfig = [
    { name: "鏈球菌", baseHp: 6 },
    { name: "葡萄球菌", baseHp: 2 },
    { name: "MRSA", baseHp: 1 }
];

const damageMatrix = [
    [6, 0, 0], // Penicillin
    [3, 2, 0], // Oxacillin
    [2, 1, 1]  // Vancomycin
];

// 輸入監聽
window.addEventListener('keydown', (e) => {
    initAudio();
    
    // 如果遊戲結束，按下 R 鍵重新開始
    if (gameOver) {
        if (e.key === 'r' || e.key === 'R') {
            resetGame();
        }
        return;
    }

    if (!gameStarted) {
        gameStarted = true;
        gameStartTime = performance.now();
        lastSpawnTime = performance.now();
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    }

    if (player.locked) return; 

    if (e.key === 'w' || e.key === 'W') {
        player.row = Math.max(0, player.row - 1);
    } else if (e.key === 's' || e.key === 'S') {
        player.row = Math.min(ROWS - 1, player.row + 1);
    } else if (e.key === 'a' || e.key === 'A') {
        player.weapon = (player.weapon + 1) % 3;
    } else if (e.key === ' ') {
        e.preventDefault();
        fireWeapon();
    }
});

function fireWeapon() {
    player.locked = true;
    setTimeout(() => { player.locked = false; }, 1000); 

    let type = player.weapon;
    projectiles.push({
        row: player.row,
        col: 1, 
        type: type
    });

    if (type === 0) playSound('smg');
    else if (type === 1) playSound('rocket');
    else if (type === 2) playSound('cannon');
}

function spawnEnemy(currentTime) {
    let elapsed = currentTime - gameStartTime;
    let difficultyRatio = Math.min(1, elapsed / 120000);
    let currentSpawnTime = baseSpawnTime - (baseSpawnTime - minSpawnTime) * difficultyRatio;
    
    if (currentTime - lastSpawnTime > currentSpawnTime) {
        let type = Math.floor(Math.random() * 3);
        enemies.push({
            row: Math.floor(Math.random() * 3),
            col: 10, 
            type: type,
            hp: enemyConfig[type].baseHp
        });
        lastSpawnTime = currentTime;
    }
}

// 重新開始遊戲的邏輯
function resetGame() {
    score = 0;
    gameOver = false;
    projectiles = [];
    enemies = [];
    player.row = 1;
    player.weapon = 0;
    player.locked = false;
    scoreBoard.innerText = "分數: " + score;
    gameStartTime = performance.now();
    lastSpawnTime = performance.now();
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function drawGrid() {
    ctx.strokeStyle = "rgba(255,255,255,0.2)";
    ctx.lineWidth = 1;
    for (let r = 0; r <= ROWS; r++) {
        ctx.beginPath();
        ctx.moveTo(0, r * CELL_SIZE);
        ctx.lineTo(canvas.width, r * CELL_SIZE);
        ctx.stroke();
    }
    for (let c = 0; c <= COLS; c++) {
        ctx.beginPath();
        ctx.moveTo(c * CELL_SIZE, 0);
        ctx.lineTo(c * CELL_SIZE, canvas.height);
        ctx.stroke();
    }
    ctx.fillStyle = "rgba(46, 204, 113, 0.1)";
    ctx.fillRect(0, 0, CELL_SIZE, canvas.height);
}

function drawPlayer() {
    let px = CELL_SIZE / 2;
    let py = player.row * CELL_SIZE + CELL_SIZE / 2;

    ctx.fillStyle = "white";
    ctx.fillRect(px - 15, py - 20, 30, 40); 
    ctx.fillStyle = "#f1c40f";
    ctx.beginPath();
    ctx.arc(px, py - 30, 15, 0, Math.PI * 2); 
    ctx.fill();

    ctx.fillStyle = weapons[player.weapon].color;
    if (player.weapon === 0) { 
        ctx.fillRect(px + 10, py - 5, 25, 6);
    } else if (player.weapon === 1) { 
        ctx.fillRect(px - 10, py - 10, 40, 15);
    } else if (player.weapon === 2) { 
        ctx.beginPath();
        ctx.arc(px + 20, py, 15, 0, Math.PI*2);
        ctx.fill();
    }

    ctx.fillStyle = weapons[player.weapon].color;
    ctx.font = "14px Arial";
    ctx.textAlign = "center";
    ctx.fillText(weapons[player.weapon].name, px, py - 50);

    if (player.locked) {
        ctx.fillStyle = "rgba(231, 76, 60, 0.7)";
        ctx.beginPath();
        ctx.arc(px, py, 45, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawProjectiles() {
    for (let p of projectiles) {
        let px = p.col * CELL_SIZE;
        let py = p.row * CELL_SIZE + CELL_SIZE / 2;
        
        ctx.fillStyle = weapons[p.type].color;
        if (p.type === 0) { 
            ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(px-15, py-5, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(px-15, py+5, 4, 0, Math.PI*2); ctx.fill();
        } else if (p.type === 1) { 
            ctx.beginPath();
            ctx.moveTo(px + 10, py);
            ctx.lineTo(px - 10, py - 10);
            ctx.lineTo(px - 10, py + 10);
            ctx.fill();
        } else if (p.type === 2) { 
            ctx.beginPath(); ctx.arc(px, py, 12, 0, Math.PI*2); ctx.fill();
        }
    }
}

function drawEnemies() {
    for (let e of enemies) {
        let ex = e.col * CELL_SIZE;
        let ey = e.row * CELL_SIZE + CELL_SIZE / 2;

        if (e.type === 0) { 
            ctx.fillStyle = "#8e44ad";
            for(let i=0; i<5; i++) {
                ctx.beginPath();
                ctx.arc(ex + (i-2)*12, ey, 8, 0, Math.PI*2);
                ctx.fill();
                ctx.stroke();
            }
        } else if (e.type === 1 || e.type === 2) { 
            ctx.fillStyle = "#f1c40f";
            let coords = [[0,-15], [-8,0], [8,0], [-16,15], [0,15], [16,15]]; 
            for (let c of coords) {
                ctx.beginPath();
                ctx.arc(ex + c[0], ey + c[1], 8, 0, Math.PI*2);
                ctx.fill();
                ctx.stroke();
            }
            if (e.type === 2) { 
                ctx.fillStyle = "red";
                ctx.beginPath();
                ctx.moveTo(ex-10, ey-30);
                ctx.lineTo(ex+10, ey-30);
                ctx.lineTo(ex+15, ey-45);
                ctx.lineTo(ex, ey-35);
                ctx.lineTo(ex-15, ey-45);
                ctx.fill();
            }
        }

        if (e.hp < enemyConfig[e.type].baseHp) {
            ctx.fillStyle = "red";
            ctx.fillRect(ex - 20, ey - 40, 40, 5);
            ctx.fillStyle = "green";
            let hpRatio = e.hp / enemyConfig[e.type].baseHp;
            ctx.fillRect(ex - 20, ey - 40, 40 * hpRatio, 5);
        }
    }
}

let lastTime = 0;
function gameLoop(currentTime) {
    if (gameOver) return;
    
    let dt = (currentTime - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1; 
    lastTime = currentTime;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGrid();
    spawnEnemy(currentTime);
    
    let elapsed = currentTime - gameStartTime;
    let difficultyRatio = Math.min(1, elapsed / 120000);
    // 使用調整後的基底與最高速度
    let currentEnemySpeed = baseEnemySpeed + (maxEnemySpeed - baseEnemySpeed) * difficultyRatio;

    for (let i = enemies.length - 1; i >= 0; i--) {
        enemies[i].col -= currentEnemySpeed * dt;
        
        if (enemies[i].col <= 0.5) {
            gameOver = true;
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "white";
            ctx.font = "48px Arial";
            ctx.textAlign = "center";
            ctx.fillText("院內感染！遊戲結束", canvas.width/2, canvas.height/2);
            ctx.font = "24px Arial";
            ctx.fillText("總分: " + score, canvas.width/2, canvas.height/2 + 40);
            ctx.font = "20px Arial";
            ctx.fillStyle = "#e74c3c";
            ctx.fillText("按下 [R] 鍵重新開始", canvas.width/2, canvas.height/2 + 85);
            return; 
        }
    }

    let projSpeed = 15; 
    for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.col += projSpeed * dt;
        
        let targetEnemy = null;
        let targetIndex = -1;
        let minCol = 100;
        
        for (let j = 0; j < enemies.length; j++) {
            if (enemies[j].row === p.row && enemies[j].col < minCol && enemies[j].col > p.col) {
                targetEnemy = enemies[j];
                targetIndex = j;
                minCol = enemies[j].col;
            }
        }

        if (targetEnemy && p.col >= targetEnemy.col - 0.5) {
            let dmg = damageMatrix[p.type][targetEnemy.type];
            if (dmg > 0) {
                targetEnemy.hp -= dmg;
                if (targetEnemy.hp <= 0) {
                    enemies.splice(targetIndex, 1);
                    score += 10;
                    scoreBoard.innerText = "分數: " + score;
                }
            }
            projectiles.splice(i, 1); 
        } else if (p.col > COLS) {
            projectiles.splice(i, 1); 
        }
    }

    drawPlayer();
    drawEnemies();
    drawProjectiles();

    requestAnimationFrame(gameLoop);
}

ctx.fillStyle = "white";
ctx.font = "24px Arial";
ctx.textAlign = "center";
ctx.fillText("點擊畫面或按任意鍵開始遊戲", canvas.width/2, canvas.height/2);

</script>
</body>
</html>
